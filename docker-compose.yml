services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: schedule_meet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schedule_meet"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Node runs in a container so nothing needs installing on the host.
  app:
    image: node:22-bookworm
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      DATABASE_URL: postgresql://postgres:postgres@db:5432/schedule_meet
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && npx prisma migrate deploy && npm run dev"

volumes:
  pgdata:
